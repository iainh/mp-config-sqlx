[workspace]
members = [".", "mp-config-sqlx-macros"]
resolver = "2"

[package]
name = "mp-config-sqlx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "SQLx datasource setup from mp-config configuration."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["config", "microprofile", "sqlx", "database"]
categories = ["config", "database"]

[dependencies]
mp-config = { git = "ssh://git@github.com/iainh/mp-config.git", tag = "v0.1.1" }
mp-config-sqlx-macros = { version = "0.1.0", path = "mp-config-sqlx-macros", optional = true }
sqlx = { version = "0.8", default-features = false }

[features]
default = ["runtime-tokio", "postgres", "mysql", "sqlite", "macros"]
macros = ["dep:mp-config-sqlx-macros"]
runtime-tokio = ["sqlx/runtime-tokio"]
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
sqlite = ["sqlx/sqlite"]
